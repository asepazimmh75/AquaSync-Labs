<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password - AquaSync</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        
        <div class="flex justify-center items-center mb-6">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="AquaSync Logo" class="w-12 h-12 mr-3 rounded-2xl shadow-sm">
            <h1 class="text-2xl font-bold text-blue-500">AquaSync</h1>
        </div>

        <h2 class="text-center text-2xl font-bold text-gray-800 mb-2">Create New Password</h2>
        <p class="text-center text-gray-500 text-sm mb-6">Secure your account with a strong password.</p>

        {% include 'components/flash.html' %}

        <form action="/reset-update" method="POST">
            
            <div class="mb-4 text-center">
                <span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-xs font-medium border border-blue-100">
                    {{ email }}
                </span>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">New Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="new_password" id="new_pass" required
                        class="w-full bg-blue-50 text-gray-700 pl-10 pr-10 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition" 
                        placeholder="New Password">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 cursor-pointer hover:text-gray-600" onclick="toggleNewPass()">
                        <i class="fa-regular fa-eye" id="iconNew"></i>
                    </span>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">Confirm Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="confirm_password" id="confirm_pass" required
                        class="w-full bg-blue-50 text-gray-700 pl-10 pr-10 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition" 
                        placeholder="Confirm Password">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 cursor-pointer hover:text-gray-600" onclick="toggleConfirmPass()">
                        <i class="fa-regular fa-eye" id="iconConfirm"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-cyan-400 hover:from-blue-600 hover:to-cyan-500 text-white font-bold py-3 rounded-lg shadow-md transition transform hover:scale-[1.02]">
                Update Password
            </button>
        </form>
    </div>

    <script>
        function toggleNewPass() {
            const input = document.getElementById('new_pass');
            const icon = document.getElementById('iconNew');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function toggleConfirmPass() {
            const input = document.getElementById('confirm_pass');
            const icon = document.getElementById('iconConfirm');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
