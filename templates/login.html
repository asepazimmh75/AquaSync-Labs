<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaSync - Sign In</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="flex justify-center items-center mb-6">
            <div class="flex justify-center items-center mb-6">
                 <img src="{{ url_for('static', filename='images/logo.png') }}" alt="AquaSync Logo" class="w-12 h-12 mr-3 rounded-2xl shadow-sm">
                <h1 class="text-2xl font-bold text-blue-500">AquaSync</h1>
            </div>
        </div>

        <h2 class="text-center text-2xl font-bold text-gray-800 mb-1">Welcome Back</h2>
        <p class="text-center text-gray-500 text-sm mb-8">Sign in to access your AquaSync dashboard</p>

        {% include 'components/flash.html' ignore missing %}

        <form action="/" method="POST" id="loginForm">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="email" name="email" id="email" required
                        class="w-full bg-blue-50 text-gray-700 pl-10 pr-3 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition" 
                        placeholder="Email Address">
                </div>
            </div>

            <div class="mb-2">
                <div class="flex justify-between items-center mb-2 ml-1">
                    <label class="block text-gray-700 text-sm font-bold">Password</label>
                    <a href="/forgot-password" class="text-xs text-blue-500 hover:underline">Forgot Password?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" id="password" required
                        class="w-full bg-blue-50 text-gray-700 pl-10 pr-10 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition" 
                        placeholder="Password">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 cursor-pointer hover:text-gray-600" onclick="togglePassword()">
                        <i class="fa-regular fa-eye" id="eyeIcon"></i>
                    </span>
                </div>
            </div>

            <div class="mb-2 mt-4">
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">Enter OTP</label>
                
                <div class="flex gap-2">
                    <div class="relative flex-grow">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-solid fa-shield-halved"></i>
                        </span>
                        <input type="text" name="otp_code" id="otp_code" maxlength="6" autocomplete="off"
                            class="w-full bg-blue-50 text-gray-700 pl-10 pr-10 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition" 
                            placeholder="Enter OTP">
                    </div>

                    <button type="button" onclick="requestOtp()" id="btnGetCode"
                        class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-3 px-4 rounded-lg transition whitespace-nowrap min-w-[100px] disabled:opacity-50 disabled:cursor-not-allowed">
                        Get Code
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full mt-6 bg-gradient-to-r from-blue-500 to-cyan-400 hover:from-blue-600 hover:to-cyan-500 text-white font-bold py-3 rounded-lg shadow-md transition transform hover:scale-[1.02]">
                Enter Dashboard
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500">
            New User? <a href="/register" class="text-blue-500 font-bold hover:underline">Create an Account</a>
        </div>
    </div>

    <script>
        // Toggle Password
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Logic Countdown Timer
        function startCooldown(duration) {
            const btn = document.getElementById('btnGetCode');
            let timer = duration;
            const cooldownEndTime = Date.now() + (duration * 1000);
            localStorage.setItem('otpCooldownEnd', cooldownEndTime);

            btn.disabled = true;
            btn.classList.remove("hover:bg-gray-300", "bg-gray-200", "text-gray-700");
            btn.classList.add("bg-gray-300", "text-gray-500");

            const interval = setInterval(() => {
                const seconds = Math.ceil((cooldownEndTime - Date.now()) / 1000);
                if (seconds <= 0) {
                    clearInterval(interval);
                    localStorage.removeItem('otpCooldownEnd');
                    btn.innerText = "Get Code";
                    btn.disabled = false;
                    btn.classList.add("bg-gray-200", "text-gray-700", "hover:bg-gray-300");
                    btn.classList.remove("bg-gray-300", "text-gray-500");
                } else {
                    btn.innerText = `Wait ${seconds}s`;
                }
            }, 1000);
        }

        window.onload = function() {
            const cooldownEnd = localStorage.getItem('otpCooldownEnd');
            if (cooldownEnd) {
                const remaining = Math.ceil((cooldownEnd - Date.now()) / 1000);
                if (remaining > 0) {
                    startCooldown(remaining);
                } else {
                    localStorage.removeItem('otpCooldownEnd');
                }
            }
        };

        async function requestOtp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btnGetCode');
            const flashDiv = document.getElementById('flash-message');

            if (!email || !password) {
                flashDiv.innerHTML = `<div class="mb-4 p-3 rounded-lg text-sm bg-red-100 text-red-700">Harap isi Email dan Password dulu!</div>`;
                return;
            }

            const originalText = btn.innerText;
            btn.innerText = "Sending...";
            btn.disabled = true;

            try {
                const response = await fetch('/ajax-send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    flashDiv.innerHTML = `<div class="mb-4 p-3 rounded-lg text-sm bg-green-100 text-green-700">${data.message}</div>`;
                    startCooldown(60); 
                } else {
                    btn.innerText = "Get Code";
                    btn.disabled = false;
                    flashDiv.innerHTML = `<div class="mb-4 p-3 rounded-lg text-sm bg-red-100 text-red-700">${data.message}</div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                btn.innerText = "Error";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
