<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaSync - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="flex justify-center items-center mb-6">
            <div class="bg-blue-500 text-white p-2 rounded-lg mr-2">
                <i class="fa-solid fa-droplet text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-blue-500">AquaSync</h1>
        </div>

        <h2 class="text-center text-2xl font-bold text-gray-800 mb-1">Welcome Back</h2>
        <p class="text-center text-gray-500 text-sm mb-8">Sign in to access your AquaSync dashboard</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="mb-4 p-3 rounded-lg text-sm {{ 'bg-red-100 text-red-700' if category == 'error' else 'bg-green-100 text-green-700' }}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

        <form action="/" method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="email" name="email" value="" 
                        class="w-full bg-blue-50 text-gray-700 pl-10 pr-3 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition" 
                        placeholder="Enter your email">
                </div>
            </div>

            <div class="mb-2">
                <div class="flex justify-between items-center mb-2 ml-1">
                    <label class="block text-gray-700 text-sm font-bold">Password</label>
                    <a href="#" class="text-xs text-blue-500 hover:underline">Forgot Password?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" id="password" value=""
                        class="w-full bg-blue-50 text-gray-700 pl-10 pr-10 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition" 
                        placeholder="Enter your password">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 cursor-pointer hover:text-gray-600" onclick="togglePassword()">
                        <i class="fa-regular fa-eye" id="eyeIcon"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="w-full mt-6 bg-gradient-to-r from-blue-500 to-cyan-400 hover:from-blue-600 hover:to-cyan-500 text-white font-bold py-3 rounded-lg shadow-md transition transform hover:scale-[1.02]">
                Enter Dashboard
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500">
            New User? <a href="/register" class="text-blue-500 font-bold hover:underline">Create an Account</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
