{% extends 'base.html' %}

{% block title %}Contact Support - AquaSync{% endblock %}

{% block content %}
    <div class="max-w-2xl mx-auto">
        
        <div class="mb-8 flex justify-between items-start md:items-center animate-[fadeIn_0.5s_ease-in-out]">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Hubungi Kami 📬</h1>
                <p class="text-gray-500 mt-1">Punya masalah teknis atau saran? Kirim pesan langsung ke developer.</p>
            </div>
             <button onclick="toggleSidebar()" class="md:hidden text-gray-600 bg-white p-2 rounded-lg shadow-sm border border-gray-100 hover:bg-gray-50 transition">
                <i class="fa-solid fa-bars text-2xl"></i>
            </button>
        </div>

        <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 relative overflow-hidden group">
            <div class="absolute -top-16 -right-16 w-32 h-32 bg-blue-100 rounded-full blur-3xl opacity-50 transition-transform duration-700 group-hover:scale-150"></div>
            
            <div class="relative z-10">
                <form action="/contact" method="POST">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">Nama Pengguna</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                                    <i class="fa-solid fa-user text-gray-400"></i>
                                </div>
                                <input type="text" value="{{ user.username }}" readonly class="w-full bg-gray-50 border border-gray-200 text-gray-500 pl-10 pr-4 py-3 rounded-xl cursor-not-allowed focus:outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">Email Anda</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                                    <i class="fa-solid fa-envelope text-gray-400"></i>
                                </div>
                                <input type="text" value="{{ user.email }}" readonly class="w-full bg-gray-50 border border-gray-200 text-gray-500 pl-10 pr-4 py-3 rounded-xl cursor-not-allowed focus:outline-none">
                            </div>
                        </div>
                    </div>

                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Subjek Masalah</label>
                        <div class="relative">
                            <select name="subject" class="w-full bg-white border border-gray-200 text-gray-700 px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none transition-colors hover:bg-gray-50">
                                <option value="Kendala Teknis">Kendala Teknis (Alat/Sensor)</option>
                                <option value="Masalah Akun">Masalah Akun & Login</option>
                                <option value="Saran Fitur">Saran & Masukan</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>

                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Pesan Detail</label>
                        <textarea name="message" rows="5" required placeholder="Jelaskan masalah atau saran Anda secara detail..." 
                            class="w-full bg-white border border-gray-200 text-gray-700 px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors"></textarea>
                    </div>

                    <button type="submit" id="btnSubmit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed disabled:bg-gray-400 disabled:shadow-none">
                        <i class="fa-regular fa-paper-plane" id="btnIcon"></i> 
                        <span id="btnText">Kirim Pesan</span>
                    </button>
                </form>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-100 flex justify-between items-center gap-4 px-2">
            <div class="text-sm text-gray-500">
                Developed by <span class="font-bold text-gray-800">Asep Aziz Miftahulhuda</span>
            </div>
            
            <a href="{{ url_for('dashboard') }}" title="Kembali ke Dashboard" class="shrink-0">
                <div class="transition transform hover:scale-110 hover:opacity-100 opacity-50 cursor-pointer">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Home" class="w-8 h-8 object-contain grayscale hover:grayscale-0 transition-all duration-300">
                </div>
            </a>
        </div>

    </div>
{% endblock %}

{% block scripts %}
    <script>
        let timeLeft = parseInt("{{ cooldown | default(0) }}");

        const btn = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        if (timeLeft > 0) {
            disableButton();
            startTimer();
        }

        function disableButton() {
            btn.disabled = true;
            btn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'shadow-md', 'hover:shadow-lg');
            btn.classList.add('bg-gray-400');
            btnIcon.style.display = 'none';
        }

        function enableButton() {
            btn.disabled = false;
            btn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'shadow-md', 'hover:shadow-lg');
            btn.classList.remove('bg-gray-400');
            btnText.innerText = "Kirim Pesan";
            btnIcon.style.display = 'inline-block';
        }

        function startTimer() {
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    enableButton();
                } else {
                    let m = Math.floor(timeLeft / 60);
                    let s = timeLeft % 60;
                    
                    btnText.innerText = `Tunggu ${m}m ${s}s`;
                    timeLeft--;
                }
            }, 1000);
        }
    </script>
{% endblock %}
