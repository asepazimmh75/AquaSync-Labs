<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaSync - Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center py-10">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md h-auto">
        <div class="flex justify-center items-center mb-4">
            <div class="bg-blue-500 text-white p-2 rounded-lg mr-2">
                <i class="fa-solid fa-droplet text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-blue-500">AquaSync</h1>
        </div>

        <h2 class="text-center text-2xl font-bold text-gray-800 mb-1">Create Account</h2>
        <p class="text-center text-gray-500 text-sm mb-6">Join AquaSync to monitor your aquarium</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="mb-4 p-3 rounded-lg text-sm {{ 'bg-red-100 text-red-700' if category == 'error' else 'bg-green-100 text-green-700' }}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

        <form action="/register" method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="text" name="username" value=""
                        class="w-full bg-blue-50 text-gray-700 pl-10 pr-3 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition" 
                        placeholder="Enter username">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" name="email"
                        class="w-full bg-white border border-gray-200 text-gray-700 pl-10 pr-3 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition" 
                        placeholder="Enter your email">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" id="regPassword" value=""
                        class="w-full bg-blue-50 text-gray-700 pl-10 pr-10 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition" 
                        placeholder="Create a password">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 cursor-pointer" onclick="toggleRegPassword()">
                        <i class="fa-regular fa-eye" id="regEyeIcon"></i>
                    </span>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1 flex items-center">
                    <i class="fa-regular fa-circle-question mr-2 text-blue-500"></i> What are we building?
                </label>
                <div class="relative">

                    <select name="quiz_answer" required class="w-full bg-white border-2 border-blue-400 text-gray-700 pl-3 pr-8 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 appearance-none">
            <option value="" disabled selected>Select your answer</option>
            <option value="correct">Sistem Monitoring dan Kontrol Pakan Akuarium berbasis IoT</option>
            
            <option value="wrong">Sistem Monitoring Cuaca</option>
            <option value="wrong">Website E-Commerce</option>
            <option value="wrong">Sistem Absensi Sekolah</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
            <i class="fa-solid fa-chevron-down text-sm"></i>
        </div>
                    
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-cyan-400 hover:from-blue-600 hover:to-cyan-500 text-white font-bold py-3 rounded-lg shadow-md transition transform hover:scale-[1.02]">
                Sign Up
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500">
            Already have an account? <a href="/" class="text-blue-500 font-bold hover:underline">Sign In</a>
        </div>
    </div>

    <script>
        function toggleRegPassword() {
            const passwordInput = document.getElementById('regPassword');
            const eyeIcon = document.getElementById('regEyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
