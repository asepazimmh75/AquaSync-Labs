<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - AquaSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="flex justify-center items-center mb-6">
            <div class="bg-blue-500 text-white p-2 rounded-lg mr-2">
                <i class="fa-solid fa-droplet text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-blue-500">AquaSync</h1>
        </div>

        <h2 class="text-center text-2xl font-bold text-gray-800 mb-2">Verify OTP</h2>
        <p class="text-center text-gray-500 text-sm mb-6">Check your email for the 6-digit code.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-3 rounded-lg text-sm {{ 'bg-red-100 text-red-700' if category == 'error' else 'bg-green-100 text-green-700' }}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/reset-verify" method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">Email Account</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" value="{{ email }}" readonly
                        class="w-full bg-gray-100 border border-gray-200 text-gray-500 pl-10 pr-3 py-3 rounded-lg cursor-not-allowed">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">Enter 6-Digit Code</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-shield-halved"></i>
                    </span>
                    <input type="text" name="otp_code" maxlength="6" required autocomplete="off"
                        class="w-full bg-blue-50 text-gray-700 pl-10 pr-3 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition text-center font-bold tracking-[0.5em]" 
                        placeholder="Enter OTP">
                </div>
            </div>

            <button type="submit" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-3 rounded-lg shadow-md transition transform hover:scale-[1.02]">
                Verify Code
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500">
            <a href="/forgot-password" class="text-gray-400 hover:text-gray-600">Change Email</a>
        </div>
    </div>
</body>
</html>
