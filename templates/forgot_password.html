<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AquaSync</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        
        <div class="flex justify-center items-center mb-6">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="AquaSync Logo" class="w-12 h-12 mr-3 rounded-2xl shadow-sm">
            <h1 class="text-2xl font-bold text-blue-500">AquaSync</h1>
        </div>

        <h2 class="text-center text-2xl font-bold text-gray-800 mb-2">Reset Password</h2>
        <p class="text-center text-gray-500 text-sm mb-6">Enter your email to receive a verification code.</p>

        {% include 'components/flash.html' %}

        <form action="/forgot-password" method="POST">
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" name="email" required
                        class="w-full bg-blue-50 text-gray-700 pl-10 pr-3 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition" 
                        placeholder="Enter your registered email">
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-cyan-400 hover:from-blue-600 hover:to-cyan-500 text-white font-bold py-3 rounded-lg shadow-md transition transform hover:scale-[1.02]">
                Send Reset Code
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500">
            Remember password? <a href="/" class="text-blue-500 font-bold hover:underline">Back to Login</a>
        </div>
    </div>
</body>
</html>
